server.address=0.0.0.0
server.port=${PORT:8080}

# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# FLYWAY MIGRATION
# ===============================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# FILE UPLOAD
# ===============================

file.upload-dir=uploads/

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB


# ===============================
# MAIL
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG


# ===============================
# CLOUDINARY
# ===============================

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}


# ===============================
# THYMELEAF
# ===============================

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


# ===============================
# REMEMBER ME
# ===============================

security.remember-me.key=${REMEMBER_ME_KEY}
security.remember-me.secure-cookie=${REMEMBER_ME_SECURE_COOKIE:false}


# ===============================
# SESSION
# ===============================

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax


# ===============================
# GOOGLE OAUTH2
# ===============================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email


# ===============================
# APPLICATION
# ===============================

app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===============================
# WIKI IMAGE CLEANUP
# ===============================

wiki.image-cleanup.schedule.enabled=${WIKI_IMAGE_CLEANUP_ENABLED:false}
wiki.image-cleanup.schedule.cron=${WIKI_IMAGE_CLEANUP_CRON:0 0 3 * * *}
wiki.image-cleanup.schedule.zone=${WIKI_IMAGE_CLEANUP_ZONE:Asia/Ho_Chi_Minh}