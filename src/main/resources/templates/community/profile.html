<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title th:text="${profile.displayName} + ' (@' + ${profile.publicHandle} + ') - Kiếm Lai Universe'">Hồ sơ tác giả - Kiếm Lai Universe</title>
<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

<!-- CSRF Meta Tags for AJAX / Reactions -->
<meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
<meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
<meta th:if="${currentUser != null}" name="current-user-id" th:content="${currentUser.id}">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" th:href="@{/css/theme.css}">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/community/community.css}">
<link rel="stylesheet" th:href="@{/css/shared/comments.css}">
<link rel="stylesheet" th:href="@{/css/shared/interaction-reactions.css}">
<link rel="stylesheet" th:href="@{/css/shared/comment-report-modal.css}">
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar(activeNav='community')}"></div>

	<main class="community-profile-container"
		th:attr="data-authenticated=${#authorization.expression('isAuthenticated()') ? 'true' : 'false'},data-current-user-id=${currentUser != null ? currentUser.id : ''}">

		<!-- Profile Header -->
		<section class="profile-header-card" aria-label="Thông tin tác giả">
			<img th:if="${profile.avatarUrl != null and !profile.avatarUrl.isBlank()}"
				th:src="${profile.avatarUrl}"
				src="/images/default_avatar.jpg"
				alt="Ảnh đại diện tác giả"
				class="profile-header-avatar"
				onerror="this.onerror=null;this.src='/images/default_avatar.jpg';">

			<img th:unless="${profile.avatarUrl != null and !profile.avatarUrl.isBlank()}"
				th:src="@{/images/default_avatar.jpg}"
				src="/images/default_avatar.jpg"
				alt="Ảnh đại diện mặc định"
				class="profile-header-avatar">

			<div class="profile-header-info">
				<h1 class="profile-display-name" th:text="${profile.displayName}">Tên người dùng</h1>
				<span class="profile-handle" th:text="'@' + ${profile.publicHandle}">@handle</span>
				<p class="profile-bio" th:if="${profile.bio != null and !profile.bio.isBlank()}" th:text="${profile.bio}">Tiểu sử</p>
			</div>
		</section>

		<!-- Authored Posts -->
		<section aria-label="Bài viết của tác giả">
			<h2 class="profile-posts-title">Bài viết cộng đồng</h2>

			<div th:if="${!profile.posts.items.isEmpty()}">
				<th:block th:each="post : ${profile.posts.items}">
					<th:block th:replace="~{community/fragments/post-card :: postCard(${post})}"/>
				</th:block>
			</div>

			<div class="empty-feed-card" th:hidden="${!profile.posts.items.isEmpty()}">
				<i class="fa-regular fa-comments empty-feed-icon" aria-hidden="true"></i>
				<p class="empty-feed-text">Chưa có bài viết nào từ tác giả này.</p>
			</div>
		</section>

	</main>

	<script th:src="@{/js/theme.js}"></script>
	<script th:src="@{/js/shared/relative-time.js}"></script>
	<script th:src="@{/js/shared/comment-presentation.js}"></script>
	<script th:src="@{/js/shared/interaction-reactions.js}" defer></script>
	<script th:src="@{/js/shared/ephemeral-draft-store.js}"></script>
	<script th:src="@{/js/shared/comment-report-modal.js}"></script>
	<script th:src="@{/js/community/community-comments.js}"></script>
	<script th:src="@{/js/community/community-post-card.js}"></script>
</body>
</html>
