<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
<meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">
<meta th:if="${currentUser != null}" name="current-user-id" th:content="${currentUser.id}">

<title>Cộng đồng - Kiếm Lai Universe</title>
<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" th:href="@{/css/theme.css}">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/community/community.css}">
<link rel="stylesheet" th:href="@{/css/shared/comments.css}">
<link rel="stylesheet" th:href="@{/css/shared/interaction-reactions.css}">
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar(activeNav='community')}"></div>

	<main class="community-container">

		<!-- Community Header -->
		<header class="community-header">
			<h1 class="community-title">Cộng đồng Kiếm Lai</h1>
			<p class="community-subtitle">Không gian giao lưu, chia sẻ cảm nhận và thảo luận về vũ trụ Kiếm Lai.</p>
		</header>

		<!-- Authenticated Composer -->
		<section sec:authorize="isAuthenticated()" class="community-composer-card" aria-label="Tạo bài viết mới">
			<form id="communityComposerForm" class="composer-form">
				<div class="composer-header">
					<img th:if="${currentUser != null and currentUser.avatarUrl != null and !currentUser.avatarUrl.isBlank()}"
						th:src="${currentUser.avatarUrl}"
						src="/images/default_avatar.jpg"
						alt="Ảnh đại diện"
						class="composer-avatar"
						onerror="this.onerror=null;this.src='/images/default_avatar.jpg';">
					<img th:unless="${currentUser != null and currentUser.avatarUrl != null and !currentUser.avatarUrl.isBlank()}"
						th:src="@{/images/default_avatar.jpg}"
						src="/images/default_avatar.jpg"
						alt="Ảnh đại diện"
						class="composer-avatar">
					<span class="composer-author-name"
						th:text="${currentUser != null and currentUser.displayName != null and !currentUser.displayName.isBlank() ? currentUser.displayName : 'Người dùng'}">
						Người dùng
					</span>
				</div>

				<div class="composer-body">
					<label for="composerCaption" class="visually-hidden">Nội dung bài viết</label>
					<textarea id="composerCaption" name="caption" class="composer-textarea"
						maxlength="2000" rows="3"
						placeholder="Chia sẻ suy nghĩ, cảm nhận của bạn về Kiếm Lai..."></textarea>
				</div>

				<!-- Image Preview -->
				<div id="composerImagePreview" class="composer-image-preview" hidden>
					<img id="composerImagePreviewImg" src="" alt="Xem trước ảnh đính kèm" class="preview-img">
					<button type="button" id="composerRemoveImageBtn" class="btn-remove-image" aria-label="Xóa ảnh đính kèm">
						<i class="fa-solid fa-xmark"></i>
					</button>
				</div>

				<!-- Error Alert -->
				<div id="composerError" class="composer-error alert alert-danger" role="alert" hidden></div>

				<!-- Composer Toolbar -->
				<div class="composer-toolbar">
					<div class="composer-actions">
						<input type="file" id="composerImageInput" name="image"
							accept="image/jpeg,image/png,image/webp" hidden>
						<button type="button" id="composerAddImageBtn" class="btn btn-sm btn-outline-secondary composer-btn-attach">
							<i class="fa-regular fa-image me-1"></i> Đính kèm ảnh
						</button>
					</div>

					<div class="composer-submit-group">
						<span id="composerCharCount" class="composer-char-count">0/2000</span>
						<button type="submit" id="composerSubmitBtn" class="btn btn-primary composer-submit-btn">
							<span id="composerSubmitText">Đăng bài</span>
							<span id="composerSubmitSpinner" class="spinner-border spinner-border-sm ms-1" role="status" hidden></span>
						</button>
					</div>
				</div>
			</form>
		</section>

		<!-- Guest Sign-in CTA -->
		<section sec:authorize="isAnonymous()" class="community-guest-card" aria-label="Đăng nhập để tham gia">
			<div class="guest-card-content">
				<p class="guest-card-text">Đăng nhập để chia sẻ bài viết và tham gia thảo luận cùng các đạo hữu.</p>
				<div class="guest-card-actions">
					<a th:href="@{/login(returnTo=${returnTo != null and !#strings.isEmpty(returnTo) ? returnTo : '/community'})}" class="btn btn-primary btn-sm">Đăng nhập</a>
					<a th:href="@{/register}" class="btn btn-outline-secondary btn-sm ms-2">Đăng ký</a>
				</div>
			</div>
		</section>

		<!-- Feed Sort Dropdown -->
		<div class="kl-sort-dropdown community-feed-sort-dropdown" id="communityFeedSortDropdown" data-sort-dropdown role="region" aria-label="Sắp xếp bài viết">
			<button type="button" id="communityFeedSortTrigger" class="kl-sort-dropdown__trigger"
				aria-haspopup="menu" aria-expanded="false" data-action="toggle-feed-sort">
				<span id="communityFeedSortLabel" class="kl-sort-dropdown__label"
					th:text="${selectedFeed == 'FEATURED' ? 'Nổi bật' : 'Mới nhất'}">Mới nhất</span>
				<i class="fa-solid fa-chevron-down kl-sort-dropdown__chevron" aria-hidden="true"></i>
			</button>
			<div id="communityFeedSortMenu" class="kl-sort-dropdown__menu" role="menu" hidden>
				<button type="button" class="kl-sort-dropdown__item"
					th:classappend="${selectedFeed != 'FEATURED'} ? ' is-selected' : ''"
					role="menuitemradio"
					th:attr="aria-checked=${selectedFeed != 'FEATURED' ? 'true' : 'false'}"
					data-action="change-feed-sort" data-feed="NEWEST">
					<i class="fa-solid fa-check kl-sort-dropdown__check" aria-hidden="true"></i>
					<span class="kl-sort-dropdown__text">Mới nhất</span>
				</button>
				<button type="button" class="kl-sort-dropdown__item"
					th:classappend="${selectedFeed == 'FEATURED'} ? ' is-selected' : ''"
					role="menuitemradio"
					th:attr="aria-checked=${selectedFeed == 'FEATURED' ? 'true' : 'false'}"
					data-action="change-feed-sort" data-feed="FEATURED">
					<i class="fa-solid fa-check kl-sort-dropdown__check" aria-hidden="true"></i>
					<span class="kl-sort-dropdown__text">Nổi bật</span>
				</button>
			</div>
		</div>

		<!-- Feed List -->
		<section class="community-feed-container" aria-label="Danh sách bài viết cộng đồng">
			<div id="communityFeedList" class="community-feed-list"
				th:attr="data-selected-feed=${selectedFeed},data-next-cursor=${nextCursor},data-next-page=${nextPage},data-has-next=${hasNext},data-authenticated=${#authorization.expression('isAuthenticated()') ? 'true' : 'false'},data-current-user-id=${currentUser != null ? currentUser.id : ''}">

				<!-- SSR Post Cards -->
				<th:block th:each="item : ${items}">
					<th:block th:replace="~{community/fragments/post-card :: postCard(${item})}"/>
				</th:block>

				<!-- Empty State Message -->
				<div id="emptyFeedMessage" class="empty-feed-card" th:hidden="${!items.isEmpty()}">
					<i class="fa-regular fa-comments empty-feed-icon"></i>
					<p class="empty-feed-text">Chưa có bài viết nào trong mục này.</p>
				</div>

			</div>

			<!-- Load More Container -->
			<div class="community-load-more-container" th:hidden="${!hasNext}">
				<button type="button" id="communityLoadMoreBtn" class="btn btn-outline-primary load-more-btn">
					Xem thêm
				</button>
				<div id="feedLoadingSpinner" class="spinner-border text-primary feed-spinner" role="status" hidden>
					<span class="visually-hidden">Đang tải...</span>
				</div>
			</div>
		</section>

	</main>

	<script th:src="@{/js/theme.js}"></script>
	<script th:src="@{/js/shared/relative-time.js}"></script>
	<script th:src="@{/js/shared/comment-presentation.js}"></script>
	<script th:src="@{/js/shared/interaction-reactions.js}" defer></script>
	<script th:src="@{/js/community/community-comments.js}"></script>
	<script th:src="@{/js/community/community-post-card.js}"></script>
	<script th:src="@{/js/community/community-composer.js}"></script>
	<script th:src="@{/js/community/community-feed.js}"></script>
</body>
</html>
