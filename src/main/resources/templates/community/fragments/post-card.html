<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<body>

<th:block th:fragment="postCard(item)">
	<article class="community-post-card"
		th:attr="data-post-id=${item.id},data-author-id=${item.authorUserId}">
		<header class="post-header">
			<!-- Author with handle link -->
			<div th:if="${item.authorPublicHandle != null and !item.authorPublicHandle.isBlank()}" class="post-author-info">
				<a th:href="@{'/community/@' + ${item.authorPublicHandle}}" class="post-author-avatar-link">
					<img th:if="${item.authorAvatarUrl != null and !item.authorAvatarUrl.isBlank()}"
						th:src="${item.authorAvatarUrl}"
						src="/images/default_avatar.jpg"
						alt="Ảnh đại diện"
						class="post-author-avatar"
						onerror="this.onerror=null;this.src='/images/default_avatar.jpg';">
					<img th:unless="${item.authorAvatarUrl != null and !item.authorAvatarUrl.isBlank()}"
						th:src="@{/images/default_avatar.jpg}"
						src="/images/default_avatar.jpg"
						alt="Ảnh đại diện"
						class="post-author-avatar">
				</a>
				<div class="post-meta">
					<div class="post-author-row">
						<a th:href="@{'/community/@' + ${item.authorPublicHandle}}" class="post-author-name"
							th:text="${item.authorDisplayName != null and !item.authorDisplayName.isBlank() ? item.authorDisplayName : 'Người dùng'}">
							Tên tác giả
						</a>
						<span class="post-author-handle" th:text="'@' + ${item.authorPublicHandle}">@handle</span>
					</div>
					<time class="post-time"
						data-relative-time
						th:datetime="${item.publishedAt}"
						th:text="${#temporals.format(item.publishedAt, 'dd/MM/yyyy HH:mm')}">Vừa xong</time>
					<button th:if="${item.contentVersion > 0}"
						type="button"
						class="post-edited-indicator"
						data-action="view-revisions"
						th:attr="data-post-id=${item.id}"
						title="Xem lịch sử chỉnh sửa">Đã chỉnh sửa</button>
				</div>
			</div>

			<!-- Author fallback when summary unresolved -->
			<div th:unless="${item.authorPublicHandle != null and !item.authorPublicHandle.isBlank()}" class="post-author-info">
				<img th:src="@{/images/default_avatar.jpg}"
					src="/images/default_avatar.jpg"
					alt="Ảnh đại diện"
					class="post-author-avatar">
				<div class="post-meta">
					<div class="post-author-row">
						<span class="post-author-name"
							th:text="${item.authorDisplayName != null and !item.authorDisplayName.isBlank() ? item.authorDisplayName : 'Người dùng'}">
							Người dùng
						</span>
					</div>
					<time class="post-time"
						data-relative-time
						th:datetime="${item.publishedAt}"
						th:text="${#temporals.format(item.publishedAt, 'dd/MM/yyyy HH:mm')}">Vừa xong</time>
					<button th:if="${item.contentVersion > 0}"
						type="button"
						class="post-edited-indicator"
						data-action="view-revisions"
						th:attr="data-post-id=${item.id}"
						title="Xem lịch sử chỉnh sửa">Đã chỉnh sửa</button>
				</div>
			</div>

			<!-- Post Actions Dropdown (Owner Only) -->
			<div sec:authorize="isAuthenticated()"
				th:if="${currentUser != null and item.authorUserId != null and currentUser.id == item.authorUserId.toString()}"
				class="post-actions-dropdown">
				<button type="button"
					class="post-actions-trigger"
					data-action="toggle-post-menu"
					aria-haspopup="menu"
					aria-expanded="false"
					aria-label="Tùy chọn bài viết"
					title="Tùy chọn">
					<i class="fa-solid fa-ellipsis" aria-hidden="true"></i>
				</button>
				<div class="post-actions-menu" role="menu" hidden>
					<button type="button"
						class="post-actions-item"
						role="menuitem"
						data-action="edit-post"
						th:attr="data-post-id=${item.id}">
						<i class="fa-regular fa-pen-to-square me-2" aria-hidden="true"></i>
						<span>Chỉnh sửa bài viết</span>
					</button>
					<button type="button"
						class="post-actions-item post-actions-item--danger text-danger"
						role="menuitem"
						data-action="delete-post"
						th:attr="data-post-id=${item.id}">
						<i class="fa-regular fa-trash-can me-2" aria-hidden="true"></i>
						<span>Xóa bài viết</span>
					</button>
				</div>
			</div>

			<!-- Post Actions Dropdown (Non-owner Authenticated: Report) -->
			<div sec:authorize="isAuthenticated()"
				th:if="${currentUser != null and item.authorUserId != null and currentUser.id != item.authorUserId.toString()}"
				class="post-actions-dropdown">
				<button type="button"
					class="post-actions-trigger"
					data-action="toggle-post-menu"
					aria-haspopup="menu"
					aria-expanded="false"
					aria-label="Tùy chọn bài viết"
					title="Tùy chọn">
					<i class="fa-solid fa-ellipsis" aria-hidden="true"></i>
				</button>
				<div class="post-actions-menu" role="menu" hidden>
					<button type="button"
						class="post-actions-item text-danger"
						role="menuitem"
						data-action="report-post"
						th:attr="data-post-id=${item.id}">
						<i class="fa-regular fa-flag me-2" aria-hidden="true"></i>
						<span>Báo cáo bài viết</span>
					</button>
				</div>
			</div>
		</header>

		<!-- Post Caption (Permalink Affordance, Escaped via th:text) -->
		<a th:href="@{'/community/posts/' + ${item.id}}" class="post-caption" th:text="${item.caption}">Nội dung bài viết</a>

		<!-- Attached Image -->
		<div th:if="${item.imageUrl != null and !item.imageUrl.isBlank()}" class="post-image-container">
			<img th:src="${item.imageUrl}" alt="Ảnh đính kèm" class="post-image" loading="lazy">
		</div>

		<!-- Post Footer -->
		<footer class="post-footer">
			<!-- Authenticated: Reaction Widget -->
			<div sec:authorize="isAuthenticated()"
				class="kl-reaction-widget"
				data-reaction-widget
				data-reaction-target-type="COMMUNITY_POST"
				th:attr="data-reaction-target-id=${item.id},data-reaction-total=${item.reactionCount},data-reaction-current=${item.currentUserReaction}">
			</div>

			<!-- Guest: Read-only metric linking to login -->
			<a sec:authorize="isAnonymous()"
				th:href="@{/login(returnTo=${returnTo != null and !#strings.isEmpty(returnTo) ? returnTo : '/community'})}"
				class="post-metric post-metric--login-link"
				title="Đăng nhập để thích">
				<i class="fa-regular fa-thumbs-up me-1" aria-hidden="true"></i>
				<span th:text="${item.reactionCount}">0</span> lượt thích
			</a>

			<!-- Comment Toggle Button -->
			<button type="button"
				class="post-metric post-comment-toggle-btn"
				data-action="toggle-comments"
				th:attr="data-post-id=${item.id}"
				aria-expanded="false"
				title="Bình luận">
				<i class="fa-regular fa-comment me-1" aria-hidden="true"></i>
				<span class="post-comment-count" th:text="${item.commentCount}">0</span> bình luận
			</button>
		</footer>

		<!-- Inline Comments Container (Lazy-loaded on first toggle) -->
		<section class="post-comments-container"
			th:attr="data-post-comments=${item.id}"
			hidden>
		</section>
	</article>
</th:block>

</body>
</html>
