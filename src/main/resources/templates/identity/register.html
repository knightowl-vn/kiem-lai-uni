<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Đăng ký - Kiếm Lai Universe</title>
<link
        rel="icon"
        type="image/png"
        th:href="@{/images/favicon.png}">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="bg-light">

	<nav class="navbar navbar-dark bg-dark px-4">
		<a class="navbar-brand" th:href="@{/}"> Kiếm Lai Universe </a>
	</nav>

	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-6 col-lg-5">

				<div class="card shadow-sm">
					<div class="card-body p-4">

						<h2 class="text-center mb-4">Tạo tài khoản</h2>

						<form id="registerForm">

							<div class="mb-3">
								<label for="email" class="form-label"> Email </label> <input
									type="email" class="form-control" id="email" required>
							</div>

							<div class="mb-3">
								<label for="password" class="form-label"> Mật khẩu </label> <input
									type="password" class="form-control" id="password"
									minlength="8" maxlength="64" required>

								<div class="form-text">Từ 8–64 ký tự, gồm chữ hoa, chữ
									thường và chữ số.</div>
							</div>

							<div class="mb-3">
								<label for="displayName" class="form-label"> Tên hiển
									thị </label> <input type="text" class="form-control" id="displayName"
									minlength="3" maxlength="50" required>
							</div>

							<button type="submit" class="btn btn-primary w-100"
								id="submitButton">Tạo tài
								khoản</button>
						</form>

						<div class="d-flex align-items-center my-4">
							<hr class="flex-grow-1">

							<span class="px-3 text-muted"> hoặc </span>

							<hr class="flex-grow-1">
						</div>

						<a th:href="@{/oauth2/authorization/google}"
							class="btn btn-outline-dark w-100
           d-flex align-items-center justify-content-center gap-2">

							<img
							src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
							alt="Google" width="20" height="20"> <span>Đăng ký
								bằng Google</span>
						</a>

						<div id="alertBox" class="mt-3" style="display: none;"></div>

						<p class="text-center mt-4 mb-0">
							Đã có tài khoản? <a th:href="@{/login}"> Đăng nhập </a>
						</p>

						<p class="text-center mt-2 mb-0">
							<a th:href="@{/}"> Quay về trang chủ </a>
						</p>

					</div>
				</div>

			</div>
		</div>
	</main>

	<script>
document
    .getElementById("registerForm")
    .addEventListener("submit", async function (event) {
        event.preventDefault();

        const alertBox = document.getElementById("alertBox");
        const submitButton = document.getElementById("submitButton");

        const payload = {
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            displayName: document.getElementById("displayName").value.trim()
        };

        alertBox.style.display = "none";
        submitButton.disabled = true;
        submitButton.innerText = "Đang tạo tài khoản...";

        try {
            const response = await fetch("/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            let result = {};

            try {
                result = await response.json();
            } catch (ignored) {
                // Response không có JSON hợp lệ
            }

            if (!response.ok) {
                throw new Error(
                    result.message ||
                    "Không thể tạo tài khoản. Vui lòng kiểm tra lại thông tin."
                );
            }

            alertBox.className = "alert alert-success mt-3";
            alertBox.innerText =
                "Tạo tài khoản thành công! Đang chuyển đến trang đăng nhập...";
            alertBox.style.display = "block";

            setTimeout(function () {
            	window.location.href = "/login?registered";
            }, 1500);

        } catch (error) {
            alertBox.className = "alert alert-danger mt-3";
            alertBox.innerText = error.message;
            alertBox.style.display = "block";

            submitButton.disabled = false;
            submitButton.innerText = "Tạo tài khoản";
        }
    });
</script>

</body>
</html>
