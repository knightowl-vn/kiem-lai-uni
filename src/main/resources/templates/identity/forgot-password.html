<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Quên mật khẩu - Kiếm Lai Universe</title>
    <link
        rel="icon"
        type="image/png"
        th:href="@{/images/favicon.png}">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background:
                linear-gradient(
                    rgba(10, 15, 20, 0.72),
                    rgba(10, 15, 20, 0.82)
                ),
                url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80")
                center/cover no-repeat fixed;
        }

        .navbar {
            background-color: rgba(15, 15, 15, 0.9) !important;
            backdrop-filter: blur(8px);
        }

        .forgot-wrapper {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .forgot-card {
            width: 100%;
            max-width: 460px;
            border: none;
            border-radius: 18px;
            background-color: rgba(255, 255, 255, 0.96);
            box-shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
        }

        .form-control,
        .submit-button {
            min-height: 48px;
            border-radius: 10px;
        }

        .sub-text {
            color: #6c757d;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <div class="container-fluid">
        <a
            class="navbar-brand fw-bold"
            th:href="@{/}">
            Kiếm Lai Universe
        </a>

        <a
            class="btn btn-outline-light btn-sm"
            th:href="@{/login}">
            Đăng nhập
        </a>
    </div>
</nav>

<main class="forgot-wrapper">
    <div class="card forgot-card">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h1 class="h3 fw-bold mb-2">
                    Quên mật khẩu
                </h1>

                <p class="sub-text mb-0">
                    Nhập email đã đăng ký để đặt lại mật khẩu.
                </p>
            </div>

            <div
                th:if="${errorMessage}"
                class="alert alert-danger"
                th:text="${errorMessage}">
            </div>

            <div
                th:if="${successMessage}"
                class="alert alert-success"
                th:text="${successMessage}">
            </div>

            <form
    method="post"
    th:action="@{/forgot-password}">

    <div class="mb-4">
        <label
            for="email"
            class="form-label fw-semibold">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="Nhập địa chỉ email"
            autocomplete="email"
            required>
    </div>

    <button
        type="submit"
        class="btn btn-dark submit-button w-100">
        Gửi liên kết đặt lại mật khẩu
    </button>
</form>

            <div class="text-center mt-4">
                <a
                    th:href="@{/login}"
                    class="text-muted text-decoration-none">
                    ← Quay lại đăng nhập
                </a>
            </div>

        </div>
    </div>
</main>

</body>
</html>
