<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Đặt lại mật khẩu - Kiếm Lai Universe</title>
<link
        rel="icon"
        type="image/png"
        th:href="@{/images/favicon.png}">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
	rel="stylesheet">

<style>
body {
	min-height: 100vh;
	background: linear-gradient(rgba(10, 15, 20, 0.72),
		rgba(10, 15, 20, 0.82)),
		url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1920&q=80")
		center/cover no-repeat fixed;
}

.reset-wrapper {
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 40px 16px;
}

.reset-card {
	width: 100%;
	max-width: 480px;
	border: none;
	border-radius: 18px;
	background-color: rgba(255, 255, 255, 0.97);
	box-shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
}

.form-control, .reset-button {
	min-height: 48px;
	border-radius: 10px;
}

.password-toggle-button {
	min-width: 56px;
	border-radius: 0 10px 10px 0;
}

.password-toggle-button i {
	font-size: 18px;
}
</style>
</head>

<body>

	<main class="reset-wrapper">
		<div class="card reset-card">
			<div class="card-body p-4 p-md-5">

				<div class="text-center mb-4">
					<h1 class="h3 fw-bold">Đặt lại mật khẩu</h1>

					<p class="text-muted">Nhập mật khẩu mới cho tài khoản của bạn.
					</p>
				</div>

				<div th:if="${errorMessage}" class="alert alert-danger" role="alert"
					th:text="${errorMessage}"></div>

				<div id="clientError" class="alert alert-danger d-none" role="alert">
				</div>

				<form id="resetPasswordForm" method="post"
					th:action="@{/reset-password}">

					<input type="hidden" name="token" th:value="${token}">

					<div class="mb-3">
						<label for="newPassword" class="form-label fw-semibold">
							Mật khẩu mới </label>

						<div class="input-group">
							<input type="password" id="newPassword" name="newPassword"
								class="form-control" minlength="8" maxlength="64"
								autocomplete="new-password" required>

							<button type="button"
								class="btn btn-outline-secondary password-toggle-button"
								data-password-target="newPassword" aria-label="Hiện mật khẩu">
								<i class="fa-regular fa-eye"></i>
							</button>
						</div>

						<div class="form-text">Từ 8 đến 64 ký tự, gồm chữ hoa, chữ
							thường và chữ số.</div>
					</div>

					<div class="mb-4">
						<label for="confirmPassword" class="form-label fw-semibold">
							Xác nhận mật khẩu mới </label>

						<div class="input-group">
							<input type="password" id="confirmPassword"
								name="confirmPassword" class="form-control" minlength="8"
								maxlength="64" autocomplete="new-password" required>

							<button type="button"
								class="btn btn-outline-secondary password-toggle-button"
								data-password-target="confirmPassword"
								aria-label="Hiện mật khẩu">
								<i class="fa-regular fa-eye"></i>
							</button>
						</div>
					</div>

					<button type="submit" class="btn btn-dark reset-button w-100">
						Đặt lại mật khẩu</button>
				</form>

				<div class="text-center mt-4">
					<a th:href="@{/login}" class="text-muted text-decoration-none">
						← Quay lại đăng nhập </a>
				</div>

			</div>
		</div>
	</main>

	<script>
		document.querySelectorAll(".password-toggle-button").forEach(
				function(button) {
					button.addEventListener("click", function() {
						const targetId = button.dataset.passwordTarget;

						const input = document.getElementById(targetId);

						const icon = button.querySelector("i");

						if (!input || !icon) {
							return;
						}

						const isHidden = input.type === "password";

						input.type = isHidden ? "text" : "password";

						icon.className = isHidden ? "fa-regular fa-eye-slash"
								: "fa-regular fa-eye";

						button.setAttribute("aria-label",
								isHidden ? "Ẩn mật khẩu" : "Hiện mật khẩu");
					});
				});
		const form = document.getElementById("resetPasswordForm");

		const newPasswordInput = document.getElementById("newPassword");

		const confirmPasswordInput = document.getElementById("confirmPassword");

		const clientError = document.getElementById("clientError");

		form
				.addEventListener(
						"submit",
						function(event) {
							clientError.classList.add("d-none");
							clientError.textContent = "";

							const newPassword = newPasswordInput.value;

							const confirmPassword = confirmPasswordInput.value;

							if (newPassword !== confirmPassword) {
								event.preventDefault();

								clientError.textContent = "Mật khẩu xác nhận không khớp.";

								clientError.classList.remove("d-none");
								return;
							}

							const hasUppercase = /[A-Z]/.test(newPassword);

							const hasLowercase = /[a-z]/.test(newPassword);

							const hasDigit = /\d/.test(newPassword);

							if (!hasUppercase || !hasLowercase || !hasDigit) {
								event.preventDefault();

								clientError.textContent = "Mật khẩu phải có chữ hoa, chữ thường và chữ số.";

								clientError.classList.remove("d-none");
							}
						});
	</script>

</body>
</html>
