<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title th:text="${article.title + ' - Kiếm Lai Wiki'}">Chi tiết
	Wiki</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/theme.css}">

<link rel="stylesheet" th:href="@{/css/navbar.css}">

<link rel="stylesheet" th:href="@{/css/wiki/wiki.css}">

</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar(activeNav='wiki')}"></div>

	<main class="container py-5 wiki-public-main">


		<!-- ================================================= -->
		<!-- UTILITY ROW: BACK LINK & READING SETTINGS TRIGGER -->
		<!-- ================================================= -->

		<div class="wiki-public-utility-row">

			<div class="wiki-public-back">
				<a th:href="@{/wiki}"> ← Quay lại Wiki </a>
			</div>

			<div class="wiki-reading-settings-wrapper">

				<button type="button"
					class="wiki-reading-settings-trigger"
					id="wikiReadingSettingsTrigger"
					data-reading-settings-trigger
					aria-expanded="false"
					aria-haspopup="dialog"
					aria-controls="wikiReadingSettingsPopover"
					aria-label="Cài đặt đọc">
					<svg class="wiki-reading-settings-gear-icon"
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 24 24"
						width="20"
						height="20"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true">
						<circle cx="12" cy="12" r="3"></circle>
						<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
					</svg>
				</button>

				<div class="wiki-reading-settings-popover"
					id="wikiReadingSettingsPopover"
					data-reading-settings-popover
					role="dialog"
					aria-label="Cài đặt đọc"
					hidden>

					<div class="wiki-reading-popover-header">
						<span class="wiki-reading-popover-title">Cài đặt đọc</span>
					</div>

					<div class="wiki-reading-popover-section">
						<span id="wikiReadingSizeLabel"
							class="wiki-reading-popover-label">Cỡ chữ</span>

						<div class="wiki-public-font-controls" role="group"
							aria-labelledby="wikiReadingSizeLabel">

							<button type="button" class="wiki-public-font-button"
								data-reading-font-action="decrease" aria-label="Giảm cỡ chữ">
								A−</button>

							<button type="button" class="wiki-public-font-button"
								data-reading-font-action="reset"
								aria-label="Khôi phục cỡ chữ mặc định">A</button>

							<button type="button" class="wiki-public-font-button"
								data-reading-font-action="increase" aria-label="Tăng cỡ chữ">
								A+</button>

						</div>
					</div>

					<div class="wiki-reading-popover-section">
						<span id="wikiReadingFamilyLabel"
							class="wiki-reading-popover-label">Kiểu chữ</span>

						<div class="wiki-public-font-controls" role="group"
							aria-labelledby="wikiReadingFamilyLabel">

							<button type="button" class="wiki-public-font-button wiki-public-font-button--family"
								data-reading-font-family="serif"
								aria-pressed="true"
								aria-label="Phông chữ có chân (Serif)">
								Serif</button>

							<button type="button" class="wiki-public-font-button wiki-public-font-button--family"
								data-reading-font-family="sans"
								aria-pressed="false"
								aria-label="Phông chữ không chân (Sans)">
								Sans</button>

						</div>
					</div>

				</div>

			</div>

		</div>

		<!-- ================================================= -->
		<!-- ARTICLE HERO                                      -->
		<!-- ================================================= -->

		<article class="card wiki-public-article">

			<div class="card-body wiki-public-article-inner">

				<header class="wiki-public-article-header">


					<!-- TYPE -->

					<span class="wiki-public-type-badge"
						th:text="${#strings.replace(
                        article.articleType,
                        '_',
                        ' '
                    )}">

						CHARACTER </span>


					<!-- TITLE -->

					<h1 class="wiki-public-title" th:text="${article.title}">Trần
						Bình An</h1>


					<!-- SUMMARY -->

					<p
						th:if="${article.summary != null
                        and !#strings.isEmpty(
                            #strings.trim(article.summary)
                        )}"
						class="wiki-public-summary" th:text="${article.summary}">Nhân
						vật chính của Kiếm Lai.</p>


					<!-- METADATA -->

					<div class="wiki-public-meta">

						<span th:if="${article.publishedAt != null}"> <span
							class="wiki-public-meta-label"> Xuất bản </span> <strong
							th:text="${#temporals.format(
                                article.publishedAt,
                                'dd/MM/yyyy HH:mm'
                            )}">

								14/08/2026 18:38 </strong>

						</span> <span
							th:if="${article.publishedAt != null
        and article.updatedAt != null}"
							class="wiki-public-meta-separator" aria-hidden="true"> • </span>
						<span th:if="${article.updatedAt != null}"> <span
							class="wiki-public-meta-label"> Cập nhật </span> <strong
							th:text="${#temporals.format(
                                article.updatedAt,
                                'dd/MM/yyyy HH:mm'
                            )}">

								14/08/2026 19:38 </strong>

						</span>

					</div>

				</header>

			</div>

		</article>

		<!-- ================================================= -->
		<!-- READING WORKSPACE                                 -->
		<!-- ================================================= -->

		<div class="wiki-public-reading-layout"
			th:classappend="${#lists.isEmpty(
        renderedContent.tableOfContents
    )} ? ' has-no-toc' : ''">


			<!-- ARTICLE -->

			<article class="wiki-public-reading-content">

				<section class="wiki-article-content"
					th:utext="${renderedContent.html}"></section>

			</article>


			<!-- TOC -->

			<aside class="wiki-public-reading-sidebar"
				th:if="${!#lists.isEmpty(
            renderedContent.tableOfContents
        )}">

				<!-- ================================================= -->
				<!-- MOBILE TOC TOGGLE                                 -->
				<!-- ================================================= -->

				<button type="button" class="wiki-public-toc-toggle"
					aria-expanded="false" aria-controls="wikiPublicToc"
					data-wiki-toc-toggle>

					<span class="wiki-public-toc-toggle-main"> <span
						class="wiki-public-toc-toggle-label"> Mục lục </span> <span
						class="wiki-public-toc-count"
						th:text="${#lists.size(
                renderedContent.tableOfContents
            )}">
							7 </span>

					</span> <span class="wiki-public-toc-toggle-icon" aria-hidden="true">
						▾ </span>

				</button>
				<nav id="wikiPublicToc" class="wiki-table-of-contents"
					aria-label="Mục lục bài viết">

					<div class="wiki-toc-header">

						<div>

							<span class="wiki-toc-eyebrow"> NỘI DUNG </span>

							<h2>Mục lục</h2>

						</div>

					</div>


					<ol class="wiki-toc-list">

						<li
							th:each="tocItem :
                        ${renderedContent.tableOfContents}"
							th:classappend="${tocItem.level == 3
                        ? ' wiki-toc-level-3'
                        : ' wiki-toc-level-2'}">

							<a th:href="${'#' + tocItem.anchor}" th:text="${tocItem.title}">

								Tổng quan </a>

						</li>

					</ol>

				</nav>


				<a class="wiki-public-back-to-top" href="#"> ↑ Đầu trang </a>

			</aside>

		</div>

	</main>

	<script th:src="@{/js/theme.js}"></script>

	<script th:src="@{/js/reading/reading-preferences.js}"></script>
	<script th:src="@{/js/wiki/wiki-reading-settings.js}"></script>
	<script th:src="@{/js/wiki/wiki-toc-scrollspy.js}"></script>
	<script th:src="@{/js/wiki/wiki-mobile-toc.js}"></script>

</body>
</html>
