<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title th:text="${article.title + ' - Kiếm Lai Wiki'}">Chi tiết
	Wiki</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/theme.css}">

<link rel="stylesheet" th:href="@{/css/navbar.css}">

<link rel="stylesheet" th:href="@{/css/wiki/wiki.css}">

</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<main class="container py-5 wiki-public-main">


		<!-- ================================================= -->
		<!-- BACK TO WIKI                                      -->
		<!-- ================================================= -->

		<div class="wiki-public-back">

			<a th:href="@{/wiki}"> ← Quay lại Wiki </a>

		</div>



		<!-- ================================================= -->
		<!-- ARTICLE HERO                                      -->
		<!-- ================================================= -->

		<article class="card wiki-public-article">

			<div class="card-body wiki-public-article-inner">

				<header class="wiki-public-article-header">


					<!-- TYPE -->

					<span class="wiki-public-type-badge"
						th:text="${#strings.replace(
                        article.articleType,
                        '_',
                        ' '
                    )}">

						CHARACTER </span>


					<!-- TITLE -->

					<h1 class="wiki-public-title" th:text="${article.title}">Trần
						Bình An</h1>


					<!-- SUMMARY -->

					<p
						th:if="${article.summary != null
                        and !#strings.isEmpty(
                            #strings.trim(article.summary)
                        )}"
						class="wiki-public-summary" th:text="${article.summary}">Nhân
						vật chính của Kiếm Lai.</p>


					<!-- METADATA -->

					<div class="wiki-public-meta">

						<span th:if="${article.publishedAt != null}"> <span
							class="wiki-public-meta-label"> Xuất bản </span> <strong
							th:text="${#temporals.format(
                                article.publishedAt,
                                'dd/MM/yyyy HH:mm'
                            )}">

								14/08/2026 18:38 </strong>

						</span> <span
							th:if="${article.publishedAt != null
        and article.updatedAt != null}"
							class="wiki-public-meta-separator" aria-hidden="true"> • </span>
						<span th:if="${article.updatedAt != null}"> <span
							class="wiki-public-meta-label"> Cập nhật </span> <strong
							th:text="${#temporals.format(
                                article.updatedAt,
                                'dd/MM/yyyy HH:mm'
                            )}">

								14/08/2026 19:38 </strong>

						</span>

					</div>

				</header>

			</div>

		</article>

		<!-- ================================================= -->
		<!-- READING SETTINGS                                  -->
		<!-- ================================================= -->

		<div class="wiki-public-reading-toolbar"
			aria-label="Tùy chỉnh đọc bài">

			<span class="wiki-public-reading-toolbar-label"> Cỡ chữ </span>

			<div class="wiki-public-font-controls" role="group"
				aria-label="Điều chỉnh cỡ chữ">

				<button type="button" class="wiki-public-font-button"
					data-wiki-font-action="decrease" aria-label="Giảm cỡ chữ">

					A−</button>


				<button type="button" class="wiki-public-font-button"
					data-wiki-font-action="reset"
					aria-label="Khôi phục cỡ chữ mặc định">A</button>


				<button type="button" class="wiki-public-font-button"
					data-wiki-font-action="increase" aria-label="Tăng cỡ chữ">

					A+</button>

			</div>

		</div>

		<!-- ================================================= -->
		<!-- READING WORKSPACE                                 -->
		<!-- ================================================= -->

		<div class="wiki-public-reading-layout"
			th:classappend="${#lists.isEmpty(
        renderedContent.tableOfContents
    )} ? ' has-no-toc' : ''">


			<!-- ARTICLE -->

			<article class="wiki-public-reading-content">

				<section class="wiki-article-content"
					th:utext="${renderedContent.html}"></section>

			</article>


			<!-- TOC -->

			<aside class="wiki-public-reading-sidebar"
				th:if="${!#lists.isEmpty(
            renderedContent.tableOfContents
        )}">

				<!-- ================================================= -->
				<!-- MOBILE TOC TOGGLE                                 -->
				<!-- ================================================= -->

				<button type="button" class="wiki-public-toc-toggle"
					aria-expanded="false" aria-controls="wikiPublicToc"
					data-wiki-toc-toggle>

					<span class="wiki-public-toc-toggle-main"> <span
						class="wiki-public-toc-toggle-label"> Mục lục </span> <span
						class="wiki-public-toc-count"
						th:text="${#lists.size(
                renderedContent.tableOfContents
            )}">
							7 </span>

					</span> <span class="wiki-public-toc-toggle-icon" aria-hidden="true">
						▾ </span>

				</button>
				<nav id="wikiPublicToc" class="wiki-table-of-contents"
					aria-label="Mục lục bài viết">

					<div class="wiki-toc-header">

						<div>

							<span class="wiki-toc-eyebrow"> NỘI DUNG </span>

							<h2>Mục lục</h2>

						</div>

					</div>


					<ol class="wiki-toc-list">

						<li
							th:each="tocItem :
                        ${renderedContent.tableOfContents}"
							th:classappend="${tocItem.level == 3
                        ? ' wiki-toc-level-3'
                        : ' wiki-toc-level-2'}">

							<a th:href="${'#' + tocItem.anchor}" th:text="${tocItem.title}">

								Tổng quan </a>

						</li>

					</ol>

				</nav>


				<a class="wiki-public-back-to-top" href="#"> ↑ Đầu trang </a>

			</aside>

		</div>

	</main>

	<script th:src="@{/js/theme.js}"></script>

	<script th:src="@{/js/wiki/wiki-reading-settings.js}"></script>
	<script th:src="@{/js/wiki/wiki-toc-scrollspy.js}"></script>
	<script th:src="@{/js/wiki/wiki-mobile-toc.js}"></script>

</body>
</html>
