<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title th:text="${article.title + ' - Kiếm Lai Wiki'}">Chi tiết
	Wiki</title>

<link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">

<link rel="stylesheet" th:href="@{/css/theme.css}">

<link rel="stylesheet" th:href="@{/css/navbar.css}">

<link rel="stylesheet" th:href="@{/css/wiki/wiki.css}">

<meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}">
<meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}">

<link rel="stylesheet" th:href="@{/css/shared/comments.css}">
<link rel="stylesheet" th:href="@{/css/wiki/wiki-comments.css}">
<link rel="stylesheet" th:href="@{/css/shared/comment-report-modal.css}">
<link th:if="${isAppreciationEligible}" rel="stylesheet" th:href="@{/css/wiki/wiki-appreciation.css}">

</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar(activeNav='wiki')}"></div>

	<main class="container py-5 wiki-public-main">


		<!-- ================================================= -->
		<!-- UTILITY ROW: BACK LINK & READING SETTINGS TRIGGER -->
		<!-- ================================================= -->

		<div class="wiki-public-utility-row">

			<div class="wiki-public-back">
				<a th:href="@{/wiki}"> ← Quay lại Wiki </a>
			</div>

			<div class="wiki-public-utility-actions">

				<!-- Save Wiki Article Button -->
				<button type="button"
					class="wiki-save-btn"
					id="wikiSaveArticleBtn"
					th:attr="data-article-id=${article.id},
					         data-save-url=@{/wiki/articles/{id}/save(id=${article.id})},
					         data-saved=${isSaved ? 'true' : 'false'},
					         data-authenticated=${#authorization.expression('isAuthenticated()') ? 'true' : 'false'},
					         data-login-url=@{/login(returnTo=${'/wiki/' + articleTypePath + '/' + article.slug})},
					         data-csrf-token=${_csrf != null ? _csrf.token : ''},
					         data-csrf-header=${_csrf != null ? _csrf.headerName : ''}"
					th:classappend="${isSaved} ? ' is-saved' : ''"
					th:aria-label="${isSaved ? 'Bỏ lưu bài viết' : 'Lưu bài viết'}"
					th:title="${isSaved ? 'Bỏ lưu bài viết' : 'Lưu bài viết'}">
					<svg class="wiki-save-icon wiki-save-icon-outline"
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 24 24"
						width="18"
						height="18"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true">
						<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
					</svg>
					<svg class="wiki-save-icon wiki-save-icon-filled"
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 24 24"
						width="18"
						height="18"
						fill="currentColor"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true">
						<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
					</svg>
					<span class="wiki-save-btn-text" th:text="${isSaved ? 'Đã lưu' : 'Lưu bài viết'}">Lưu bài viết</span>
				</button>

				<div class="wiki-reading-settings-wrapper">

				<button type="button"
					class="wiki-reading-settings-trigger"
					id="wikiReadingSettingsTrigger"
					data-reading-settings-trigger
					aria-expanded="false"
					aria-haspopup="dialog"
					aria-controls="wikiReadingSettingsPopover"
					aria-label="Cài đặt đọc">
					<svg class="wiki-reading-settings-gear-icon"
						xmlns="http://www.w3.org/2000/svg"
						viewBox="0 0 24 24"
						width="20"
						height="20"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						aria-hidden="true">
						<circle cx="12" cy="12" r="3"></circle>
						<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
					</svg>
				</button>

				<div class="wiki-reading-settings-popover"
					id="wikiReadingSettingsPopover"
					data-reading-settings-popover
					role="dialog"
					aria-label="Cài đặt đọc"
					hidden>

					<div class="wiki-reading-popover-header">
						<span class="wiki-reading-popover-title">Cài đặt đọc</span>
					</div>

					<div class="wiki-reading-popover-section">
						<span id="wikiReadingSizeLabel"
							class="wiki-reading-popover-label">Cỡ chữ</span>

						<div class="wiki-public-font-controls" role="group"
							aria-labelledby="wikiReadingSizeLabel">

							<button type="button" class="wiki-public-font-button"
								data-reading-font-action="decrease" aria-label="Giảm cỡ chữ">
								A−</button>

							<button type="button" class="wiki-public-font-button"
								data-reading-font-action="reset"
								aria-label="Khôi phục cỡ chữ mặc định">A</button>

							<button type="button" class="wiki-public-font-button"
								data-reading-font-action="increase" aria-label="Tăng cỡ chữ">
								A+</button>

						</div>
					</div>

					<div class="wiki-reading-popover-section">
						<span id="wikiReadingFamilyLabel"
							class="wiki-reading-popover-label">Kiểu chữ</span>

						<div class="wiki-public-font-controls" role="group"
							aria-labelledby="wikiReadingFamilyLabel">

							<button type="button" class="wiki-public-font-button wiki-public-font-button--family"
								data-reading-font-family="serif"
								aria-pressed="true"
								aria-label="Phông chữ có chân (Serif)">
								Serif</button>

							<button type="button" class="wiki-public-font-button wiki-public-font-button--family"
								data-reading-font-family="sans"
								aria-pressed="false"
								aria-label="Phông chữ không chân (Sans)">
								Sans</button>

						</div>
					</div>

				</div>

			</div>

			</div>

		</div>

		<!-- ================================================= -->
		<!-- ARTICLE HERO                                      -->
		<!-- ================================================= -->

		<article class="card wiki-public-article">

			<div class="card-body wiki-public-article-inner">

				<header class="wiki-public-article-header wiki-public-profile-header">

					<!-- TOPBAR: TYPE BADGE (LEFT) & TIMESTAMPS (RIGHT) -->
					<div class="wiki-public-profile-topbar">
						<span class="wiki-public-type-badge"
							th:text="${#strings.replace(
	                        article.articleType,
	                        '_',
	                        ' '
	                    )}">
							CHARACTER
						</span>

						<div class="wiki-public-meta wiki-public-profile-meta">
							<span th:if="${article.publishedAt != null}">
								<span class="wiki-public-meta-label"> Xuất bản </span>
								<strong><time
									data-relative-time
									th:datetime="${article.publishedAt}"
									th:text="${#temporals.format(
	                                article.publishedAt,
	                                'dd/MM/yyyy HH:mm'
	                            )}">14/08/2026 18:38</time></strong>
							</span>
							<span th:if="${article.publishedAt != null and article.updatedAt != null}"
								class="wiki-public-meta-separator" aria-hidden="true"> • </span>
							<span th:if="${article.updatedAt != null}">
								<span class="wiki-public-meta-label"> Cập nhật </span>
								<strong><time
									data-relative-time
									th:datetime="${article.updatedAt}"
									th:text="${#temporals.format(
	                                article.updatedAt,
	                                'dd/MM/yyyy HH:mm'
	                            )}">14/08/2026 19:38</time></strong>
							</span>
						</div>
					</div>

					<!-- PROFILE BODY: 4:5 HERO PORTRAIT (LEFT) + INFO & APPRECIATION (RIGHT) -->
					<div class="wiki-public-profile-body" th:classappend="${article.coverMediaAssetId == null ? ' has-no-cover' : ''}">

						<!-- COVER IMAGE -->
						<div th:if="${article.coverMediaAssetId != null}" class="wiki-public-cover-wrapper">
							<img class="wiki-public-cover-image"
								th:src="${article.displayCoverImageUrl()}"
								th:data-fallback-src="${article.fallbackCoverImageUrl()}"
								th:alt="${article.title}"
								th:style="'object-position: ' + ${article.coverObjectPosition()}"
								onerror="if (!this.getAttribute('data-tried-fallback') &amp;&amp; this.getAttribute('data-fallback-src')) { this.setAttribute('data-tried-fallback', 'true'); this.src = this.getAttribute('data-fallback-src'); } else { this.parentElement.style.display='none'; }">
						</div>

						<div class="wiki-public-profile-info">
							<!-- TITLE -->
							<h1 class="wiki-public-title" th:text="${article.title}">Trần Bình An</h1>

							<!-- SUMMARY -->
							<p th:if="${article.summary != null and !#strings.isEmpty(#strings.trim(article.summary))}"
								class="wiki-public-summary" th:text="${article.summary}">Nhân vật chính của Kiếm Lai.</p>

							<!-- ================================================= -->
							<!-- WIKI APPRECIATION (CHARACTER & FACTION ONLY)       -->
							<!-- ================================================= -->
							<div th:if="${isAppreciationEligible and appreciationState != null}"
								class="wiki-appreciation-widget"
								id="wikiAppreciationWidget"
								th:attr="data-article-id=${article.id},
								         data-appreciation-url=@{/api/wiki/articles/{id}/appreciation(id=${article.id})},
								         data-viewer-value=${appreciationState.viewerValue != null ? appreciationState.viewerValue : ''},
								         data-authenticated=${#authorization.expression('isAuthenticated()') ? 'true' : 'false'},
								         data-login-url=@{/login(returnTo=${'/wiki/' + articleTypePath + '/' + article.slug})},
								         data-csrf-token=${_csrf != null ? _csrf.token : ''},
								         data-csrf-header=${_csrf != null ? _csrf.headerName : ''}">
								<div class="wiki-appreciation-label">Mức độ yêu thích</div>
								<div class="wiki-appreciation-body">
									<div class="wiki-appreciation-stars" role="group" aria-label="Đánh giá mức độ yêu thích từ 1 đến 5 sao">
									<!-- Star 1: 1.0 (Full star semantic target) -->
									<div class="wiki-star-slot">
										<button type="button"
											class="wiki-star-btn wiki-star-btn--full"
											data-star-value="1.0"
											th:classappend="${appreciationState.viewerValue != null and appreciationState.viewerValue >= 1.0} ? ' is-active' : ''"
											th:aria-pressed="${appreciationState.viewerValue != null and appreciationState.viewerValue == 1.0 ? 'true' : 'false'}"
											aria-label="Yêu thích 1 trên 5"
											title="1 sao">
											<svg class="wiki-star-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
												<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
											</svg>
										</button>
									</div>

									<!-- Star 2: Split 1.5 (Left) and 2.0 (Right) -->
									<div class="wiki-star-slot wiki-star-slot--split">
										<button type="button"
											class="wiki-star-btn wiki-star-btn--half-left"
											data-star-value="1.5"
											th:classappend="${appreciationState.viewerValue != null and appreciationState.viewerValue >= 1.5} ? ' is-active' : ''"
											th:aria-pressed="${appreciationState.viewerValue != null and appreciationState.viewerValue == 1.5 ? 'true' : 'false'}"
											aria-label="Yêu thích 1.5 trên 5"
											title="1.5 sao">
											<svg class="wiki-star-icon wiki-star-icon--half-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 24" width="11" height="22" fill="currentColor" aria-hidden="true">
												<path d="M12 2 L12 17.77 L5.82 21.02 L7 14.14 L2 9.27 L8.91 8.26 Z"/>
											</svg>
										</button>
										<button type="button"
											class="wiki-star-btn wiki-star-btn--half-right"
											data-star-value="2.0"
											th:classappend="${appreciationState.viewerValue != null and appreciationState.viewerValue >= 2.0} ? ' is-active' : ''"
											th:aria-pressed="${appreciationState.viewerValue != null and appreciationState.viewerValue == 2.0 ? 'true' : 'false'}"
											aria-label="Yêu thích 2 trên 5"
											title="2 sao">
											<svg class="wiki-star-icon wiki-star-icon--half-right" xmlns="http://www.w3.org/2000/svg" viewBox="12 0 12 24" width="11" height="22" fill="currentColor" aria-hidden="true">
												<path d="M12 2 L15.09 8.26 L22 9.27 L17 14.14 L18.18 21.02 L12 17.77 Z"/>
											</svg>
										</button>
									</div>

									<!-- Star 3: Split 2.5 (Left) and 3.0 (Right) -->
									<div class="wiki-star-slot wiki-star-slot--split">
										<button type="button"
											class="wiki-star-btn wiki-star-btn--half-left"
											data-star-value="2.5"
											th:classappend="${appreciationState.viewerValue != null and appreciationState.viewerValue >= 2.5} ? ' is-active' : ''"
											th:aria-pressed="${appreciationState.viewerValue != null and appreciationState.viewerValue == 2.5 ? 'true' : 'false'}"
											aria-label="Yêu thích 2.5 trên 5"
											title="2.5 sao">
											<svg class="wiki-star-icon wiki-star-icon--half-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 24" width="11" height="22" fill="currentColor" aria-hidden="true">
												<path d="M12 2 L12 17.77 L5.82 21.02 L7 14.14 L2 9.27 L8.91 8.26 Z"/>
											</svg>
										</button>
										<button type="button"
											class="wiki-star-btn wiki-star-btn--half-right"
											data-star-value="3.0"
											th:classappend="${appreciationState.viewerValue != null and appreciationState.viewerValue >= 3.0} ? ' is-active' : ''"
											th:aria-pressed="${appreciationState.viewerValue != null and appreciationState.viewerValue == 3.0 ? 'true' : 'false'}"
											aria-label="Yêu thích 3 trên 5"
											title="3 sao">
											<svg class="wiki-star-icon wiki-star-icon--half-right" xmlns="http://www.w3.org/2000/svg" viewBox="12 0 12 24" width="11" height="22" fill="currentColor" aria-hidden="true">
												<path d="M12 2 L15.09 8.26 L22 9.27 L17 14.14 L18.18 21.02 L12 17.77 Z"/>
											</svg>
										</button>
									</div>

									<!-- Star 4: Split 3.5 (Left) and 4.0 (Right) -->
									<div class="wiki-star-slot wiki-star-slot--split">
										<button type="button"
											class="wiki-star-btn wiki-star-btn--half-left"
											data-star-value="3.5"
											th:classappend="${appreciationState.viewerValue != null and appreciationState.viewerValue >= 3.5} ? ' is-active' : ''"
											th:aria-pressed="${appreciationState.viewerValue != null and appreciationState.viewerValue == 3.5 ? 'true' : 'false'}"
											aria-label="Yêu thích 3.5 trên 5"
											title="3.5 sao">
											<svg class="wiki-star-icon wiki-star-icon--half-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 24" width="11" height="22" fill="currentColor" aria-hidden="true">
												<path d="M12 2 L12 17.77 L5.82 21.02 L7 14.14 L2 9.27 L8.91 8.26 Z"/>
											</svg>
										</button>
										<button type="button"
											class="wiki-star-btn wiki-star-btn--half-right"
											data-star-value="4.0"
											th:classappend="${appreciationState.viewerValue != null and appreciationState.viewerValue >= 4.0} ? ' is-active' : ''"
											th:aria-pressed="${appreciationState.viewerValue != null and appreciationState.viewerValue == 4.0 ? 'true' : 'false'}"
											aria-label="Yêu thích 4 trên 5"
											title="4 sao">
											<svg class="wiki-star-icon wiki-star-icon--half-right" xmlns="http://www.w3.org/2000/svg" viewBox="12 0 12 24" width="11" height="22" fill="currentColor" aria-hidden="true">
												<path d="M12 2 L15.09 8.26 L22 9.27 L17 14.14 L18.18 21.02 L12 17.77 Z"/>
											</svg>
										</button>
									</div>

									<!-- Star 5: Split 4.5 (Left) and 5.0 (Right) -->
									<div class="wiki-star-slot wiki-star-slot--split">
										<button type="button"
											class="wiki-star-btn wiki-star-btn--half-left"
											data-star-value="4.5"
											th:classappend="${appreciationState.viewerValue != null and appreciationState.viewerValue >= 4.5} ? ' is-active' : ''"
											th:aria-pressed="${appreciationState.viewerValue != null and appreciationState.viewerValue == 4.5 ? 'true' : 'false'}"
											aria-label="Yêu thích 4.5 trên 5"
											title="4.5 sao">
											<svg class="wiki-star-icon wiki-star-icon--half-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 24" width="11" height="22" fill="currentColor" aria-hidden="true">
												<path d="M12 2 L12 17.77 L5.82 21.02 L7 14.14 L2 9.27 L8.91 8.26 Z"/>
											</svg>
										</button>
										<button type="button"
											class="wiki-star-btn wiki-star-btn--half-right"
											data-star-value="5.0"
											th:classappend="${appreciationState.viewerValue != null and appreciationState.viewerValue >= 5.0} ? ' is-active' : ''"
											th:aria-pressed="${appreciationState.viewerValue != null and appreciationState.viewerValue == 5.0 ? 'true' : 'false'}"
											aria-label="Yêu thích 5 trên 5"
											title="5 sao">
											<svg class="wiki-star-icon wiki-star-icon--half-right" xmlns="http://www.w3.org/2000/svg" viewBox="12 0 12 24" width="11" height="22" fill="currentColor" aria-hidden="true">
												<path d="M12 2 L15.09 8.26 L22 9.27 L17 14.14 L18.18 21.02 L12 17.77 Z"/>
											</svg>
										</button>
									</div>
								</div>
								<div class="wiki-appreciation-stats" id="wikiAppreciationStats" aria-live="polite">
									<div class="wiki-appreciation-score-line">
										<span class="wiki-appreciation-average" id="wikiAppreciationAverage"
											th:hidden="${appreciationState.count == 0 or appreciationState.average == null}"
											th:text="${appreciationState.count > 0 and appreciationState.average != null ? appreciationState.displayAverage() : ''}">4.7</span>
										<span class="wiki-appreciation-separator"
											th:hidden="${appreciationState.count == 0 or appreciationState.average == null}">/ 5</span>
									</div>
									<span class="wiki-appreciation-dot"
										th:hidden="${appreciationState.count == 0 or appreciationState.average == null}"
										aria-hidden="true">·</span>
									<span class="wiki-appreciation-count" id="wikiAppreciationCount"
										th:text="${appreciationState.count > 0 ? (appreciationState.count + ' lượt đánh giá') : 'Chưa có đánh giá'}">Chưa có đánh giá</span>
								</div>
							</div>
							<div class="wiki-appreciation-feedback" id="wikiAppreciationFeedback" role="status" aria-live="polite"></div>
						</div>
					</div>

				</header>

			</div>

		</article>

		<!-- ================================================= -->
		<!-- READING WORKSPACE                                 -->
		<!-- ================================================= -->

		<div class="wiki-public-reading-layout"
			th:classappend="${#lists.isEmpty(
        renderedContent.tableOfContents
    )} ? ' has-no-toc' : ''">


			<!-- ARTICLE -->

			<article class="wiki-public-reading-content">

				<section class="wiki-article-content"
					th:utext="${renderedContent.html}"></section>

			</article>


			<!-- TOC -->

			<aside class="wiki-public-reading-sidebar"
				th:if="${!#lists.isEmpty(
            renderedContent.tableOfContents
        )}">

				<!-- ================================================= -->
				<!-- MOBILE TOC TOGGLE                                 -->
				<!-- ================================================= -->

				<button type="button" class="wiki-public-toc-toggle"
					aria-expanded="false" aria-controls="wikiPublicToc"
					data-wiki-toc-toggle>

					<span class="wiki-public-toc-toggle-main"> <span
						class="wiki-public-toc-toggle-label"> Mục lục </span> <span
						class="wiki-public-toc-count"
						th:text="${#lists.size(
                renderedContent.tableOfContents
            )}">
							7 </span>

					</span> <span class="wiki-public-toc-toggle-icon" aria-hidden="true">
						▾ </span>

				</button>
				<nav id="wikiPublicToc" class="wiki-table-of-contents"
					aria-label="Mục lục bài viết">

					<div class="wiki-toc-header">

						<div>

							<span class="wiki-toc-eyebrow"> NỘI DUNG </span>

							<h2>Mục lục</h2>

						</div>

					</div>


					<ol class="wiki-toc-list">

						<li
							th:each="tocItem :
                        ${renderedContent.tableOfContents}"
							th:classappend="${tocItem.level == 3
                        ? ' wiki-toc-level-3'
                        : ' wiki-toc-level-2'}">

							<a th:href="${'#' + tocItem.anchor}" th:text="${tocItem.title}">

								Tổng quan </a>

						</li>

					</ol>

				</nav>


				<a class="wiki-public-back-to-top" href="#"> ↑ Đầu trang </a>

			</aside>

		</div>

		<!-- ================================================= -->
		<!-- ARTICLE DISCUSSION                                -->
		<!-- ================================================= -->
		<section id="wikiDiscussion"
			class="wiki-discussion-section"
			aria-labelledby="wikiDiscussionHeading"
			th:attr="data-article-id=${article.id},
			         data-authenticated=${#authorization.expression('isAuthenticated()') ? 'true' : 'false'},
			         data-login-url=@{/login(returnTo=${'/wiki/' + articleTypePath + '/' + article.slug + '#wikiDiscussion'})},
			         data-csrf-token=${_csrf != null ? _csrf.token : ''},
			         data-csrf-header=${_csrf != null ? _csrf.headerName : ''}">

			<header class="wiki-discussion-header">
				<div class="wiki-discussion-heading-row">
					<h2 id="wikiDiscussionHeading" class="wiki-discussion-title">
						Thảo luận
					</h2>
					<span class="wiki-discussion-count-badge" id="wikiDiscussionCountBadge" aria-live="polite">
						0 bình luận
					</span>
				</div>
			</header>

			<!-- ROOT COMMENT COMPOSER -->
			<div class="wiki-comment-composer wiki-comment-composer--root" id="wikiRootComposer">
				<form class="wiki-comment-composer-form" id="wikiRootComposerForm">
					<label for="wikiRootComposerInput" class="visually-hidden">Viết bình luận</label>
					<textarea id="wikiRootComposerInput"
						class="wiki-comment-textarea"
						rows="3"
						placeholder="Chia sẻ ý kiến của bạn về bài viết này..."
						maxlength="2000"></textarea>
					<div class="wiki-comment-composer-footer">
						<span class="wiki-comment-composer-error" id="wikiRootComposerError" role="alert" aria-live="polite" hidden></span>
						<div class="wiki-comment-composer-actions">
							<button type="submit" class="wiki-comment-btn wiki-comment-btn--primary" id="wikiRootComposerSubmit">
								Bình luận
							</button>
						</div>
					</div>
				</form>
			</div>

			<!-- STATUS & ERROR REGION -->
			<div id="wikiDiscussionStatus" class="wiki-discussion-status" role="status" aria-live="polite"></div>

			<!-- THREAD LIST -->
			<div id="wikiDiscussionThreadList" class="wiki-discussion-thread-list" role="feed" aria-busy="false" aria-label="Danh sách bình luận"></div>

			<!-- LOAD MORE CONTAINER -->
			<div class="wiki-discussion-footer" id="wikiDiscussionFooter" hidden>
				<button type="button" class="wiki-comment-btn wiki-comment-btn--secondary" id="wikiDiscussionLoadMoreBtn">
					Tải thêm bình luận
				</button>
			</div>

		</section>

	</main>

	<script th:src="@{/js/theme.js}"></script>

	<script th:src="@{/js/reading/reading-preferences.js}"></script>
	<script th:src="@{/js/wiki/wiki-reading-settings.js}"></script>
	<script th:src="@{/js/wiki/wiki-toc-scrollspy.js}"></script>
	<script th:src="@{/js/wiki/wiki-mobile-toc.js}"></script>
	<script th:src="@{/js/wiki/wiki-saved.js}" defer></script>
	<script th:src="@{/js/shared/ephemeral-draft-store.js}" defer></script>
	<script th:src="@{/js/shared/comment-report-modal.js}" defer></script>
	<script th:src="@{/js/shared/comment-presentation.js}" defer></script>
	<script th:src="@{/js/wiki/wiki-comments.js}" defer></script>
	<script th:if="${isAppreciationEligible}" th:src="@{/js/wiki/wiki-appreciation.js}" defer></script>
</body>
</html>
