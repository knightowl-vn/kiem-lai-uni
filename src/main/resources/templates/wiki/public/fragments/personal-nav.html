<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="personalNav(activeTab)"
     class="wiki-personal-nav"
     aria-label="Điều hướng cá nhân Wiki">
    <div class="wiki-personal-nav-list">
        <a th:href="@{/wiki/saved}"
           class="wiki-personal-nav-item"
           th:classappend="${activeTab == 'saved'} ? ' is-active' : ''"
           th:attr="aria-current=${activeTab == 'saved' ? 'page' : null}">
            <svg class="wiki-personal-nav-icon"
                 xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 width="18"
                 height="18"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
            </svg>
            <span>Bài viết đã lưu</span>
        </a>

        <a th:href="@{/wiki/contributions}"
           class="wiki-personal-nav-item"
           th:classappend="${activeTab == 'contributions'} ? ' is-active' : ''"
           th:attr="aria-current=${activeTab == 'contributions' ? 'page' : null}">
            <svg class="wiki-personal-nav-icon"
                 xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 width="18"
                 height="18"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            <span>Đóng góp của tôi</span>
        </a>
    </div>
</nav>

</body>
</html>
