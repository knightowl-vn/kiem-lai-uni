<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle}">Chi tiết tập phim - Kiếm Lai Universe</title>

    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/screen/screen.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="screen-detail-container">

        <!-- Navigation Breadcrumb back to parent ScreenTitle -->
        <nav class="screen-detail-breadcrumb" aria-label="Đường dẫn điều hướng">
            <a th:href="@{/screen/{slug}(slug=${entryDetail.titleSlug})}" class="screen-detail-back-link">
                &larr; Quay lại tác phẩm: <strong th:text="${entryDetail.titleDisplayName}">Kiếm Lai</strong>
            </a>
        </nav>

        <!-- Entry Detail Card -->
        <article class="screen-entry-detail-card" aria-label="Thông tin chi tiết tập phim">
            <header class="screen-entry-detail-header">
                <span class="screen-badge screen-badge--highlight" th:text="${entryDetail.displayHeading()}">Tập 1</span>
                <h1 class="screen-entry-detail-title" th:text="${entryDetail.entryTitle}">Tên tập phim</h1>
                <p class="screen-entry-detail-parent-ref">
                    Thuộc tác phẩm:
                    <a th:href="@{/screen/{slug}(slug=${entryDetail.titleSlug})}"
                       th:text="${entryDetail.titleDisplayName}">Kiếm Lai Phần 1</a>
                </p>
            </header>

            <!-- Metadata Row -->
            <div class="screen-entry-detail-meta" th:if="${entryDetail.formattedDuration() != null}">
                <div class="screen-meta-row">
                    <span class="screen-meta-label">Thời lượng:</span>
                    <span class="screen-meta-value" th:text="${entryDetail.formattedDuration()}">24:00</span>
                </div>
            </div>

            <!-- Thumbnail if available -->
            <div class="screen-entry-detail-thumbnail-wrap" th:if="${entryDetail.hasThumbnail()}">
                <img class="screen-entry-detail-thumbnail"
                     th:src="${entryDetail.displayThumbnailUrl()}"
                     th:data-fallback-src="${entryDetail.fallbackThumbnailUrl()}"
                     th:alt="${entryDetail.entryTitle}"
                     loading="lazy"
                     onerror="if (!this.getAttribute('data-tried-fallback') &amp;&amp; this.getAttribute('data-fallback-src')) { this.setAttribute('data-tried-fallback', 'true'); this.src = this.getAttribute('data-fallback-src'); } else { this.style.display='none'; }">
            </div>

            <!-- Playback Notice (Transparent Boundary for MS-08G) -->
            <div class="screen-playback-notice" role="status" aria-label="Thông báo phát video">
                <div class="screen-playback-notice-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <div class="screen-playback-notice-content">
                    <h2 class="screen-playback-notice-title">Trình phát video đang được hoàn thiện</h2>
                    <p class="screen-playback-notice-description">
                        Tính năng xem video trực tuyến cho tập phim này sẽ sẵn sàng ở giai đoạn phát triển tiếp theo (MS-08G).
                    </p>
                </div>
            </div>

            <!-- Synopsis if present -->
            <div class="screen-entry-detail-synopsis" th:if="${entryDetail.entrySynopsis != null and !entryDetail.entrySynopsis.isBlank()}">
                <h2 class="screen-entry-synopsis-label">Tóm tắt tập</h2>
                <p class="screen-entry-synopsis-text" th:text="${entryDetail.entrySynopsis}">
                    Nội dung tóm tắt của tập phim.
                </p>
            </div>
        </article>

    </main>

    <script th:src="@{/js/theme.js}"></script>

</body>
</html>
