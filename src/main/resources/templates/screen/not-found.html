<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${pageTitle != null ? pageTitle : 'Không tìm thấy tác phẩm - Kiếm Lai Universe'}">Không tìm thấy tác phẩm - Kiếm Lai Universe</title>

    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/screen/screen.css}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="screen-catalog-container">
        <div class="screen-not-found-card">
            <svg class="screen-empty-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <h1 class="screen-not-found-title" th:text="${errorTitle != null ? errorTitle : 'Tác phẩm không tồn tại'}">
                Tác phẩm không tồn tại
            </h1>
            <p class="screen-not-found-description" th:text="${errorMessage != null ? errorMessage : 'Tác phẩm bạn đang tìm không tồn tại, đã bị gỡ hoặc chưa được xuất bản.'}">
                Tác phẩm bạn đang tìm không tồn tại, đã bị gỡ hoặc chưa được xuất bản.
            </p>
            <a th:href="@{/screen}" class="screen-out-of-range-btn">
                ← Quay lại danh mục phim
            </a>
        </div>
    </main>

    <script th:src="@{/js/theme.js}"></script>

</body>
</html>
