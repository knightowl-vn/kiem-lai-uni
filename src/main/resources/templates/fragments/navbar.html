<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

	<nav th:fragment="navbar"
		class="navbar navbar-dark bg-dark px-4 py-2 main-navbar">

		<!-- Liên kết Home -->
		<a class="navbar-home-link"
			th:classappend="${activeNav == 'home'} ? ' active' : ''"
			th:attr="aria-current=${activeNav == 'home' ? 'page' : null}"
			th:href="@{/home}"
			aria-label="Trang chủ">
			<svg class="navbar-home-icon"
				xmlns="http://www.w3.org/2000/svg"
				viewBox="0 0 24 24"
				width="18"
				height="18"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				aria-hidden="true">
				<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
				<polyline points="9 22 9 12 15 12 15 22"></polyline>
			</svg>
			<span class="navbar-home-text">Home</span>
		</a>

		<!-- Liên kết Novel -->
		<a class="navbar-novel-link"
			th:classappend="${activeNav == 'novel'} ? ' active' : ''"
			th:attr="aria-current=${activeNav == 'novel' ? 'page' : null}"
			th:href="@{/novel}"> Novel </a>

		<!-- Liên kết Wiki -->
		<a class="navbar-wiki-link"
			th:classappend="${activeNav == 'wiki'} ? ' active' : ''"
			th:attr="aria-current=${activeNav == 'wiki' ? 'page' : null}"
			th:href="@{/wiki}"> Wiki </a>

		<!-- Tìm kiếm nhanh điều hướng -->
		<div class="navbar-wiki-search" id="navbarWikiSearch">

			<form class="navbar-wiki-search-form" id="navbarWikiSearchForm"
				method="get" th:action="@{${activeNav == 'novel' ? '/novel/locate' : '/search'}}" role="search">

				<label class="visually-hidden" for="navbarWikiKeyword">Tìm kiếm</label>

				<input th:if="${activeNav != 'novel'}"
					type="hidden" name="scope"
					th:value="${navbarSearchScope != null and !navbarSearchScope.isBlank() ? navbarSearchScope : (activeNav == 'wiki' ? 'wiki' : (activeNav == 'community' ? 'community' : 'all'))}">

				<input id="navbarWikiKeyword"
					class="navbar-wiki-search-input" type="search" name="q"
					autocomplete="off" placeholder="Tìm kiếm Wiki, Novel chương..."
					th:value="${navbarSearchQuery != null ? navbarSearchQuery : ''}">

				<button class="navbar-wiki-search-submit" type="submit"
					aria-label="Gửi tìm kiếm">

					<svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
							d="M10.5 4a6.5 6.5 0 1 0 0 13
                             6.5 6.5 0 0 0 0-13Zm-8.5 6.5
                             a8.5 8.5 0 1 1 15.15 5.3
                             l4.52 4.53-1.42 1.41-4.52-4.52
                             A8.5 8.5 0 0 1 2 10.5Z" />
                </svg>

				</button>

			</form>

			<button class="navbar-wiki-search-toggle" id="navbarWikiSearchToggle"
				type="button" aria-label="Mở tìm kiếm"
				aria-controls="navbarWikiSearchForm" aria-expanded="false">

				<svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
						d="M10.5 4a6.5 6.5 0 1 0 0 13
                         6.5 6.5 0 0 0 0-13Zm-8.5 6.5
                         a8.5 8.5 0 1 1 15.15 5.3
                         l4.52 4.53-1.42 1.41-4.52-4.52
                         A8.5 8.5 0 0 1 2 10.5Z" />
            </svg>

				<svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
						d="m6.7 5.3 5.3 5.29
                         5.3-5.3 1.4 1.42-5.29 5.3
                         5.3 5.29-1.42 1.42-5.3-5.3
                         -5.29 5.3-1.41-1.42
                         5.29-5.3-5.3-5.29Z" />
            </svg>

			</button>

		</div>

		<!-- Menu tài khoản -->
		<div class="navbar-account-area">

			<!-- Chưa đăng nhập -->
			<div sec:authorize="isAnonymous()" class="profile-menu">

				<button class="profile-avatar-button" type="button"
					aria-label="Mở menu tài khoản khách">
					<img th:src="@{/images/default_avatar.jpg}"
						src="/images/default_avatar.jpg" alt="Ảnh đại diện khách"
						class="profile-avatar"
						onerror="this.onerror=null;this.src='/images/default_avatar.jpg';">
				</button>

				<div class="profile-dropdown">

					<div class="profile-dropdown-header">
						<strong>Khách</strong> <span>Chưa đăng nhập</span>
					</div>

					<div class="profile-dropdown-divider"></div>

					<a th:href="@{/login}" class="profile-dropdown-item js-navbar-auth-link" data-auth-type="login"> Đăng nhập
					</a> <a th:href="@{/register}" class="profile-dropdown-item js-navbar-auth-link" data-auth-type="register"> Đăng
						ký </a>

				</div>
			</div>

			<!-- Đã đăng nhập -->
			<div sec:authorize="isAuthenticated()" class="navbar-authenticated-group">

				<!-- Nút chuông thông báo & Popover/Panel -->
				<div class="navbar-notifications" id="navbarNotifications"
					th:attr="data-csrf-token=${_csrf != null ? _csrf.token : ''},data-csrf-header=${_csrf != null ? _csrf.headerName : ''}">

					<button class="navbar-bell-button" id="navbarBellButton" type="button"
						aria-label="Thông báo"
						aria-expanded="false"
						aria-controls="navbarNotificationsPanel">
						<svg class="navbar-bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
							<path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
						</svg>
						<span class="navbar-bell-badge" id="navbarBellBadge" hidden aria-hidden="true">0</span>
						<span class="visually-hidden" id="navbarBellBadgeSr">0 thông báo chưa đọc</span>
					</button>

					<!-- Panel / Popover Thông báo -->
					<div class="navbar-notifications-panel" id="navbarNotificationsPanel" role="region" aria-label="Bảng thông báo" hidden>
						<div class="notif-panel-header">
							<div class="notif-header-title-row">
								<button type="button" class="notif-mobile-back-button" id="notifMobileBackButton" aria-label="Đóng bảng thông báo">
									<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
										<line x1="19" y1="12" x2="5" y2="12"></line>
										<polyline points="12 19 5 12 12 5"></polyline>
									</svg>
								</button>
								<h2 class="notif-header-title">Thông báo</h2>
								<button type="button" class="notif-mark-all-btn" id="notifMarkAllBtn" disabled>
									Đánh dấu tất cả đã đọc
								</button>
							</div>

							<div class="notif-filter-tabs" role="tablist" aria-label="Bộ lọc thông báo">
								<button type="button" class="notif-filter-btn is-active" id="notifFilterAll" data-filter="all" role="tab" aria-selected="true" aria-controls="notifFeedList">
									Tất cả
								</button>
								<button type="button" class="notif-filter-btn" id="notifFilterUnread" data-filter="unread" role="tab" aria-selected="false" aria-controls="notifFeedList">
									Chưa đọc
								</button>
							</div>
						</div>

						<div class="notif-panel-body" id="notifPanelBody">
							<div class="notif-feed-list" id="notifFeedList" tabindex="-1">
								<!-- Dynamically populated by navbar-notifications.js -->
							</div>
							<div class="notif-feed-footer" id="notifFeedFooter" hidden>
								<button type="button" class="notif-load-more-btn" id="notifLoadMoreBtn">
									Xem thêm
								</button>
							</div>
						</div>
					</div>
				</div>

				<div class="profile-menu">

					<button class="profile-avatar-button" type="button"
						aria-label="Mở menu tài khoản">
						<img
							th:src="${currentUser != null
	                        and currentUser.avatarUrl != null
	                        and !currentUser.avatarUrl.isBlank()
	                        ? currentUser.avatarUrl
	                        : '/images/default_avatar.jpg'}"
							src="/images/default_avatar.jpg" alt="Ảnh đại diện"
							th:attr="referrerpolicy='no-referrer'" class="profile-avatar"
							onerror="this.onerror=null;this.src='/images/default_avatar.jpg';">
					</button>

					<div class="profile-dropdown">

						<div class="profile-dropdown-header">

							<strong
								th:text="${currentUser != null
	                            and currentUser.displayName != null
	                            and !currentUser.displayName.isBlank()
	                            ? currentUser.displayName
	                            : 'Người dùng'}">
								Người dùng </strong> <span
								th:text="${currentUser != null
	                            and currentUser.email != null
	                            ? currentUser.email
	                            : #authentication.name}">
								email@example.com </span>

						</div>

						<div class="profile-dropdown-divider"></div>

						<a th:href="@{/profile}" class="profile-dropdown-item"> Xem hồ sơ </a>
						<a th:href="@{/novel/history}" class="profile-dropdown-item"> Novel của tôi </a>
						<a th:href="@{/wiki/saved}" class="profile-dropdown-item"> Wiki của tôi </a>
						<a th:href="@{/comments/my}" class="profile-dropdown-item"> Bình luận của tôi </a>

						<div class="profile-dropdown-divider"></div>

						<div class="theme-section">
							<div class="theme-section-title">GIAO DIỆN</div>

							<div class="theme-toggle-row">
								<div class="theme-toggle-label">
									<i class="fa-solid fa-moon"></i> <span>Chế độ tối</span>
								</div>

								<label class="theme-switch"> <input type="checkbox"
									id="themeToggleCheckbox" aria-label="Bật hoặc tắt chế độ tối">

									<span class="theme-slider"></span>
								</label>
							</div>
						</div>

						<div class="profile-dropdown-divider"></div>

						<form th:action="@{/logout}" method="post" class="m-0">
							<button type="submit" class="profile-dropdown-item logout-button">
								<i class="fa-solid fa-arrow-right-from-bracket me-2"></i> Đăng xuất
							</button>
						</form>

					</div>
				</div>
			</div>

		</div>
		<script
        th:src="@{/js/shared/relative-time.js}"
        defer>
</script>
		<script
        th:src="@{/js/navbar-search.js}"
        defer>
</script>
		<script
        th:src="@{/js/navbar-notifications.js}"
        defer>
</script>
		<script
        th:src="@{/js/navbar-auth.js}"
        defer>
</script>
	</nav>

</body>
</html>
