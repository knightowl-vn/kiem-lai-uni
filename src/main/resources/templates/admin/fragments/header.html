<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

	<header class="admin-header" th:fragment="header(pageTitle)">

		<div class="admin-header-main">

			<button id="adminMobileMenuButton" type="button"
				class="admin-mobile-menu-button" aria-label="Mở menu quản trị"
				aria-controls="adminSidebar" aria-expanded="false">

				<span aria-hidden="true">☰</span>

			</button>

			<div class="admin-header-title">

				<h1 th:text="${pageTitle}">Tổng quan</h1>

				<p>Theo dõi và quản lý hoạt động của hệ thống</p>

			</div>

		</div>

		<div class="header-actions" th:if="${currentUser != null}">

			<div class="admin-badge">
				<span class="status-dot"></span> <span
					th:text="${'ROLE_' + currentUser.role}"> ROLE_ADMIN </span>
			</div>

			<div class="header-account">

				<strong th:text="${currentUser.displayName}"> Quản trị viên
				</strong> <span
					th:text="${currentUser.role == 'SUPER_ADMIN'
                        ? 'Super Admin'
                        : currentUser.role == 'ADMIN'
                        ? 'Quản trị viên'
                        : 'Người dùng'}">
					Quản trị viên </span>

			</div>
		</div>
		<script th:src="@{/js/admin/mobile-navigation.js}" defer>
		</script>

	</header>

</body>
</html>
