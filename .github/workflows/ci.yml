name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: kiemlai_test
          MYSQL_USER: kiemlai
          MYSQL_PASSWORD: kiemlai_test_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # ===============================
      # DATABASE
      # ===============================
      DB_URL: jdbc:mysql://127.0.0.1:3306/kiemlai_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: kiemlai
      DB_PASSWORD: kiemlai_test_password

      # ===============================
      # TEST RUNTIME VERIFICATION
      # ===============================
      TEST_MYSQL_HOST: 127.0.0.1:3306
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASS: root
      TEST_MYSQL_DB: kiemlai_test

      # ===============================
      # REMEMBER ME
      # ===============================
      REMEMBER_ME_KEY: ci-remember-me-key-for-tests-only

      # ===============================
      # MAIL
      # ===============================
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-mail-password

      # ===============================
      # GOOGLE OAUTH
      # ===============================
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret

      # ===============================
      # CLOUDINARY
      # ===============================
      CLOUDINARY_CLOUD_NAME: ci-cloud-name
      CLOUDINARY_API_KEY: ci-api-key
      CLOUDINARY_API_SECRET: ci-api-secret

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify CI environment
        run: |
          test -n "$DB_URL"
          test -n "$DB_USERNAME"
          test -n "$DB_PASSWORD"
          test -n "$TEST_MYSQL_HOST"
          test -n "$TEST_MYSQL_USER"
          test -n "$TEST_MYSQL_PASS"
          test -n "$TEST_MYSQL_DB"
          test -n "$REMEMBER_ME_KEY"
          test -n "$MAIL_USERNAME"
          test -n "$MAIL_PASSWORD"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$CLOUDINARY_CLOUD_NAME"
          test -n "$CLOUDINARY_API_KEY"
          test -n "$CLOUDINARY_API_SECRET"

          echo "All required CI environment variables are set"

      - name: Build and run tests
        run: ./mvnw -B test